---
layout: default
---
<article class="article"><div class="article-head"><p class="kicker">{{ page.category }} · {{ page.conference }}</p><h1>{{ page.title }}</h1><p class="lead">{{ page.description }}</p><p class="meta">{{ page.speaker }} · {{ page.year }}</p></div><div class="prose">{{ content }}</div><div class="resource-row">{% if page.slides %}<a class="button" href="{{ page.slides }}">View slides</a>{% endif %}{% if page.youtube %}<a class="button secondary" href="{{ page.youtube }}">Watch video</a>{% endif %}</div></article>
