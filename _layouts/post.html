---
layout: default
---
<article class="article"><div class="article-head"><p class="kicker">{{ page.categories | join: " · " }}</p><h1>{{ page.title }}</h1><p class="lead">{{ page.description }}</p><p class="meta">{{ page.author }} · {{ page.date | date: "%B %d, %Y" }}</p></div><div class="prose">{{ content }}</div></article>
