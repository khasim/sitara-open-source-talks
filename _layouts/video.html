layout: default

<article class="article"><div class="article-head"><p class="kicker">{{ page.category }}</p><h1>{{ page.title }}</h1><p class="lead">{{ page.description }}</p><p class="meta">{{ page.speaker }} · {{ page.year }}</p></div><div class="video-wrap"><iframe src="{{ page.youtube_embed }}" title="{{ page.title }}" allowfullscreen></iframe></div><div class="prose">{{ content }}</div></article>
